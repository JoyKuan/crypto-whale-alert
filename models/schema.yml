version: 2

models:
  - name: stg_btc
    description: "This is the staging model for BTC transactions."
    columns:
      - name: hash_key
        tests:
          - unique
          - not_null
  - name: whale_alert
    latest_version: 2
    description: "This is the staging model for BTC transactions."
    config:
      contract:
        enforced: true
    columns:
      - name: invocation_id
        data_type: string
      - name: output_address
        data_type: string
        data_tests:
          - assert_valid_btc_address
      - name: total_sent
        data_type: float
      - name: transaction_count
        data_type: int
      - name: total_sent_usd
        data_type: float

    versions:
      - v: 1
        deprecation_date: 2027-10-18
        config:
          enabled: false
        # Matches what's above -- nothing more needed
      - v: 2
        # Removed a column -- this is the breaking change!
        columns:
          # This means: use the 'columns' list from above, but exclude country_name
          - include: all
            exclude: [total_sent_usd]


exposures:

  - name: btc_whale_alert_exposure
    label: BTC Whale Alert
    type: dashboard
    maturity: high
    url: https://datastudio.google.com/reporting/fa27f962-d805-46e0-a1da-f6f4ecb4ba97
    description: >
      BTC Whale Alert transactions report.

    depends_on:
      - ref('whale_alert', v=2)

    owner:
      name: Joy
version: 2

sources:
  - name: btc
    database: btc
    schema: dev_joy
    tables:
      - name: btc_txn
        freshness:   # default freshness for all tables
          warn_after: {count: 1, period: hour}
          error_after: {count: 3, period: hour}
        loaded_at_field: block_timestamp

  - name: customers
    database: customers
    schema: customers
    tables:
      - name: customer_status